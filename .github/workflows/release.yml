name: Release

on:
  push:
    tags:
      - 'v*'
      - 'build-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build all modules
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
      - name: Collect and re-sign APKs
        run: |
          mkdir -p out
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in $(find . -path ./out -prune -o -name '*.apk' -path '*/outputs/apk/*' -print); do
            d=${f%%/build/outputs/*}
            m=$(basename "$d")
            o="out/${m}-${GITHUB_REF_NAME:-manual}.apk"
            cp "$f" "$o"
            if [ -f ci/appathy.keystore ]; then
              "$TOOLS/apksigner" sign --ks ci/appathy.keystore --ks-pass pass:appathy-store --ks-key-alias appathy "$o"
            fi
          done
          ls -la out/
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
