name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: '8.9'
  JAVA_VERSION: '17'
  NDK_VERSION: '26.3.11579264'
  CMAKE_VERSION: '3.22.1'
  LLAMA_REPO: 'https://github.com/PrismML-Eng/llama.cpp'
  LLAMA_REF: 'prism'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> $GITHUB_ENV
      - name: Fetch llama.cpp
        run: |
          rm -rf app/src/main/cpp/llama.cpp
          git clone --depth 1 --branch "${LLAMA_REF}" "${LLAMA_REPO}" app/src/main/cpp/llama.cpp \
            || git clone "${LLAMA_REPO}" app/src/main/cpp/llama.cpp
          cd app/src/main/cpp/llama.cpp
          git checkout "${LLAMA_REF}" 2>/dev/null || true
          git rev-parse HEAD
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build all modules
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; GR="./gradlew"; else GR="gradle"; fi
          $GR assembleRelease || $GR assembleDebug
      - name: Collect, align and sign APKs
        run: |
          mkdir -p out
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in $(find . -path ./out -prune -o -name '*.apk' -path '*/outputs/apk/*' -print); do
            case "$f" in
              */apk/debug/*) if find . -path '*/outputs/apk/release/*.apk' | grep -q .; then continue; fi ;;
            esac
            d=${f%%/build/outputs/*}
            m=$(basename "$d")
            o="out/${m}-${GITHUB_REF_NAME:-manual}.apk"
            "$TOOLS/zipalign" -f 4 "$f" "$o"
            "$TOOLS/apksigner" sign --ks ci/appathy.keystore --ks-pass pass:appathy-store --ks-key-alias appathy "$o"
            "$TOOLS/apksigner" verify --print-certs "$o" | head -2
          done
          ls -la out/
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
